; DLSSNR-AMD-Vulkan ReShade add-on settings; edits take effect when saved, also in game.
[DlssNr]
Enabled=true
; 1..3; 1..30 with UnlockPasses=true
Passes=1
UnlockPasses=false
; Model resolution, 0.25..2; above 1 is supersampling: the picture is enlarged for the network and the result made small again, slower the larger
WorkingScale=1.000
; spatial compression (as OptiScaler DLSS-NR's SpatialCompression): true = the centre of the picture the network sees (SpatialCenterX/Y,
; percent of the picture, default 80) keeps its density and the surround is compressed, into SpatialWorkX/Y (percent, default 90); faster,
; less NR at the edges; SpatialOffsetX/Y move the centre, SpatialShiftX/Y share the compression between the sides (percent, default 0)
SpatialCompression=false
SpatialCenterX=80.0
SpatialCenterY=80.0
SpatialWorkX=90.0
SpatialWorkY=90.0
SpatialOffsetX=0.0
SpatialOffsetY=0.0
SpatialShiftX=0.0
SpatialShiftY=0.0
; the filter with WorkingScale above 1 (as OptiScaler DLSS-NR's ScalingDownscaler): 0 = FSR 1 (bilinear);
; otherwise bicubic up and down by: 1 = bicubic; 2 = Catmull-Rom; 3 = Lanczos 2; 4 = Lanczos 3 (default);
; 5 = Kaiser 2; 6 = Kaiser 3; 7 = MAGIC
ScalingDownscaler=4
; 0 Standard, 1 Natural, 2 Cinematic
Style=0
Intensity=1.000
LocalStructure=1.000
LocalTone=1.000
; -1 follows LocalStructure
SkinStructure=-1.000
AutoMask=true
; Apply edit: Detail strength 0..2, Colour strength 0..4 (above 1 adds saturation),
; Highlight guard 1..8
TransferStrength=1.000
ColourStrength=1.000
MaxRatio=2.000
; Model resolution below 1: how the model's result is enlarged back to full resolution:
;   0 Bilinear: the model's input and output are both enlarged bilinearly, then composed as at 100%
;   1 Matched residual (default): the model's change, enlarged, is added to the full-resolution picture
;   2 Lighting + colour: the lighting and colour of the model's change as one enlarged edit applied to the full-resolution picture
;   3 Edge-aware lighting + colour: lighting and colour of the change enlarged apart (weighted by the full-resolution picture's edges), then applied
;   4 Classic: the model's output picture is enlarged directly, the way ClassicScaler says
Transfer=1
; How Transfer=4 enlarges: bilinear, catmullrom, lanczos3, fsr1
ClassicScaler=catmullrom
; the highlight curve of HDR pictures handed to the network (as OptiScaler DLSS-NR's ReversibleMode): 0 = soft knee (default); 1 = Neutwo;
; 2 = Neutwo, the network's result replaces the composition; 3 = Hybrid; 4 = Hybrid, the network's result replaces the composition.
; 2 and 4 use the network's result directly on SDR pictures too
ReversibleMode=0
; ReversibleMode 2 or 4 with Model resolution below 1: the game picture's local contrast put back into the network's result, 0..2, 0 = off (default)
ReplaceDetailStrength=0.000
; skin protection (as OptiScaler DLSS-NR's SkinProtection): true = by how skin-like a pixel is, NR's lighting change is kept by
; SkinDetail (skin) / EnvironmentDetail (elsewhere) and its colour change by SkinColour / EnvironmentColour, 0..1,
; 1 = all kept, 0 = the game's own; with false (default) these four do nothing
SkinProtection=false
SkinDetail=1.000
SkinColour=1.000
EnvironmentDetail=1.000
EnvironmentColour=1.000
; from pass 2 on, own settings: Pass2Style, Pass2Intensity, Pass2LocalStructure,
; Pass2LocalTone, Pass2SkinStructure, Pass2AutoMask, Pass3... the same.
; what is not written follows pass 1, LocalTone defaulting to 0.

; This project's own settings
; How strongly the previous frame's result is blended into this one, 0..1
History=1.000
; White point of linear-light input
WhitePoint=1.000
; Frames without motion vectors (DLSS5_MV not bound): the network's noise seed changes every frame, as in
; NVIDIA's original. With no previous frame to average the noise, a still picture shimmers slightly. false (default): a fixed seed
NoiseEveryFrame=false
; Where the ReShade routes' motion vectors come from: vort (in this package) or lumenite (LumeniteFX Kernel by
; Afzaal, installed from its author's GitHub with install.bat (LumeniteFX: y); when it is missing or cannot be used,
; vort runs and dlssnr-amd.log says why)
MotionVectors=vort

[Network]
; Which network NR runs. It can be changed in game at any time: the drop-down in NR Control (OptiScaler
; routes, opened with End) or on ReShade's Add-ons page, or the Hotkey; a change is written here, so the next
; game start uses it.

Model = CC_SMALL_FP8
; CC_SMALL_FP8                  = the default network of NVIDIA 310.9.16
; CC_SMALL_FP8_EXPERIMENTAL     = this project's experimental network: CC_SMALL_FP8 made faster; its weights are
;                                 made from CC_SMALL_FP8's model at install; ACO Mode only (below)
; CC_SILVER_AARDWOLD            = the network of 310.8.0 (also preset 1 of 310.9.16)
; CC_SILVER_AARDWOLD_OPTIMIZED  = this project's faster CC_SILVER_AARDWOLD, its picture very close to it; its weights
;                                 are made from CC_SILVER_AARDWOLD's model at install; ACO Mode only (below)
; A network that cannot run (e.g. no 310.9.16 model file) is greyed out in the menus with the reason, and the
; hotkey skips it.

OptimizedLayers = 3
; CC_SILVER_AARDWOLD_OPTIMIZED only: how many of its layers run in a faster form. It changes only how the network
; computes, not the resolution; every level's picture stays very close to CC_SILVER_AARDWOLD's. 0 = Quality: none
; in int4, every layer at CC_SILVER_AARDWOLD's precision;
; 1 = Balanced: some of them in int4; 2 = Performance: also fixed attention on the first full-resolution
; layers; 3 = Ultra Performance (default): also more int4 layers, the fastest.
; Changed in game, the network is built again

Hotkey = Ctrl+F11
; Cycles through the networks that can run, to compare them on the same picture. Empty = no hotkey. Ctrl,
; Shift, Alt and one key, e.g. Alt+F9

Sound = 1
; A sound when the network changes (hotkey, menu or this file): one note = CC_SMALL_FP8, two notes going down = CC_SILVER_AARDWOLD,
; two notes going up = CC_SILVER_AARDWOLD_OPTIMIZED, one high note = CC_SMALL_FP8_EXPERIMENTAL. 0 = silent

Residency = auto
; What is kept of a network that is no longer running. The networks share one activation memory, so what is kept is mainly the weights.
; When switching back, the current network keeps running until the other one is ready.
; auto     = only the weights stay in video memory, switching back is quick; when video memory runs short they move to RAM, and are freed when RAM runs short too (default)
; resident = the whole network stays in video memory; switching back is instant, uses the most video memory
; offload  = the weights move to RAM and all video memory is freed; switching back copies them back
; minimal  = video memory and RAM are freed; switching back builds the network again
; NR off for more than 10 s: offload and minimal also treat the running network so; auto only when video memory runs short

Motion Without Depth = 1
; Where the network reads a pixel's motion vector to fetch the previous frame. Applied after a game restart.
; 1 = the pixel's own motion vector, depth not used, as NVIDIA's DLL does (default)
; 0 = with depth, the motion vector of whichever of the pixel and its four diagonal neighbours is nearest
;     the camera
; Only matters for consecutive frames with motion vectors and depth: the edges of moving objects

Resize History = 0
; What happens to NR's previous result when the game's render size changes (dynamic resolution). Only
; matters with NR before the upscaler.
; 0 = dropped, NR starts again at the new size, as NVIDIA's DLL does (default)
; 1 = scaled to the new size and kept. Steadier in our tests when the size changes often, but not what
;     NVIDIA's DLL does. Most DLSS games jitter their input, which hides most of the restart, so it is off
;     by default

Style Grade = 1
; The grade of the Natural and Cinematic styles:
; 1 = as NVIDIA's DLL: the picture is graded for the style after the network (default)
; 0 = the picture of 0.0.6 and earlier (without that step after the network). Standard is not affected;
;     applied at once

OSD = switch
; the running network in the corner of the picture:
; switch = while a switch builds, its progress; then the new network for 3 s (default)
; always = all the time
; cost   = all the time, with each layer's GPU time split into the network and its processing, and the sums
; off    = never

Memory Guard = 0
; 1 = a network is built only while the video memory it needs is free (what it needs: measured on your GPU
;     at its first build), and the running one steps aside once video memory has run out
; 0 = no such check: NR builds and runs in whatever video memory is left (default). A game left short of video
;     memory may stutter or fail to load its own data. Applied at once

History Precision = 16
; The precision of the images NR keeps its previous result in:
; 16 = 16-bit, as NVIDIA's DLL keeps it; half the memory (default)
; 32 = 32-bit, as up to 0.0.8.1 (4K: 133 MB more a network, 66 MB more each further pass)
; With several passes the two can differ in fine detail. Applied at once (the previous result starts afresh)

; ACO Mode is not a setting: the network always runs as machine code made in advance by the ACO compiler (the
; one the Linux version uses), loaded by the AMD driver. When that cannot be used, NR Control and dlssnr-amd.log
; say why, and an RX 9000 runs the network compiled by the AMD driver instead (without CC_SMALL_FP8_EXPERIMENTAL
; and CC_SILVER_AARDWOLD_OPTIMIZED); RX 7000 and the Radeon 700M / 800M / 8000S graphics have no NR then.

[Preprocess]
; Changes the picture the NR network is shown (exposure, display curve, contrast, saturation),
; and so how NR edits the picture.
; Two uses:
;   - a personal look, in any game: change the settings below. It departs from the original look;
;     it may be better or worse.
;   - games that do not hand their exposure to the upscaler: NR gets a picture several stops too
;     dark and turns it green and grainy (007 First Light); turning it on fixes that.
; Values marked [upstream] are the same as off; with every value at [upstream] nothing runs.
; Numbers may have decimals.
; The first time it is turned on (the hotkey too) NR rebuilds, and a second or two of frames
; go without NR.

Enabled = 0
; 0 = off, no preprocessing runs (default)
; 1 = on; by default only the filmic curve, no exposure change. The Hotkey switches it in game for this run, never written to this file

Exposure = off
; off   = no exposure change [upstream] (the game's exposure when it gives one, else a fixed white point)
; auto  = auto exposure after Unreal Engine's design: adjusts to the picture's brightness, up or
;         down, and follows scene changes smoothly. For games that give no exposure, such as 007
;         First Light. When a game gives its exposure properly and you want your own colour look,
;         use off, not auto
; fixed = no automatic change; ExposureBias alone

ExposureBias = 0.00
; exposure compensation in EV (stops), -8 .. +8. 0 = none [upstream]
; every stop is a factor of 2: +1 = the network sees it twice as bright, -1 = half
; fixed: the whole gain, the same every frame
; auto:  added to what auto works out; the sum is the gain. Auto +4.5 with ExposureBias = 0.5 =
;        5 stops up
; off:   unused

Curve = filmic
; the display curve of the picture the NR network is shown. Test the effect yourself; the hotkey
; compares on the same picture
; none = no change [upstream], neutral, reinhard, filmic, gt, aces, agx

Contrast = 1.00
; contrast of the picture the NR network is shown, about mid grey, 0.5 .. 2. 1.0 = no change
; [upstream]

Saturation = 1.00
; saturation of the picture the NR network is shown, 0.05 .. 2 (not 0). 1.0 = no change [upstream]

Inverse = 1
; how NR's change is put back (only when Curve, Contrast or Saturation is not at its [upstream] value):
;   1 = through the bounded inverse of the curve and the rest (default); clipping, the gain limit and storage precision still affect changes in bright areas
;   0 = by the ratio of NR's change in the picture it saw; gentler changes in bright areas

Hotkey = Ctrl+F10
; switches the whole preprocess on and off in the game (flips Enabled for this run), to compare
; on the same picture. Never written to this file. Empty = no hotkey. Ctrl, Shift, Alt and one
; key, e.g. Alt+F9

Sound = 1
; a short sound when it switches (hotkey or this file): two notes going up = on, going down = off.
; 0 = silent

[RenoDX]
; RenoDX style: the processing around NR (how the picture is handed to NR and how NR's result is put back) follows RenoDX's DLSS5 add-on
; v8.5.0-rc10, with its own shaders (MIT). The NR network itself is the same.
; The RenoDX style's NR settings are in this section (the network in [Network], Preprocess in [Preprocess]); on the OptiScaler
; route OptiScaler only does upscaling and frame generation. In game: End opens NR Control on the OptiScaler route; ReShade's Add-ons page on the ReShade route.
; On the OptiScaler route, with [LayerN] sections (layers stacked in NR Control) each layer's settings are in its own section and this one is not used.
; The keys other than Enabled keep RenoDX's names, defaults and ranges; a value out of range is taken as the default.
; On the OptiScaler route the keys of this section (Enabled too) apply when saved, also in game; on the ReShade route Enabled applies after a
; game restart, the other keys when saved.

Enabled = 0
; 1 = RenoDX style
; 0 = OptiScaler route: the wilsjo2 style (settings in [wilsjo2]); ReShade route: this project's own processing (settings in [DlssNr])

NeuralUplift = 1
; 1 = NR on (default); 0 = off, the picture passes through unchanged

NRToggleKey = F6
; hotkey that switches NR on / off in game (for the current run only, not written back), default F6; empty = none

NRHookPoint = 2
; OptiScaler route only: where NR runs. 0 = after the upscaler; 1 = before the upscaler;
; 2 = Present, on the finished picture the game hands to the system (default). The ReShade route does not use this key: NR is always at Present.

; the network's own settings (pass 1)

NRIntensity = 1.00
; 0 .. 2, default 1. Strength of the enhancement

NRStyle = 0
; 0 = Standard (default); 1 = Natural; 2 = Cinematic

NRLocalTone = 1.00
; 0 .. 2, default 1. Local tone

NRLocalStructure = 1.00
; 0 .. 2, default 1. Local structure

NRSkinStructure = -1.00
; -1 .. 1, default -1 (unchanged). Structure on skin, only with NRAutoMask = 1

NRAutoMask = 0
; 1 = automatic mask (Character mask): skin is found and treated on its own; 0 = off (default)

NRSkinIndependent = 1
; 1 = with the automatic mask on, skin follows only NRSkinStructure, not NRLocalStructure; NRLocalStructure then reaches
; the network as at most 1 (above 1 the network ignores the skin setting) (default); 0 = both values go to the network as they are

; Passes (stacking): how many times the network runs a frame; each pass hands the previous pass's result to the network again and puts it back with this pass's strength.
; Every pass costs one more network run; the frame rate drops noticeably.

NRPassesMode = legacy
; legacy = Passes (legacy), the network runs again for every pass (default); fast = Passes (fast), the network runs once a frame.
NRFastMethod = 1
; 0 = Interleaved: the legacy passes run one per frame in turn, each with its own history; a still picture looks as legacy's. Needs motion vectors: without them it does not run (one network pass).
; 1 = Extrapolation (default): strengthens this frame's one network change; needs no motion vectors, works from the first frame.
; 2 = Feedback: feeds the last frame's change back into this frame's network input along the motion vectors; builds up over the first frames.
; 3 = Hybrid: Feedback where the history can be trusted, Extrapolation on new surfaces, scene cuts and edges.
; 4 = Edit strength: the same method as Adjust NR's look's Edit strength, the network's change (in code values) times the strength; needs no motion vectors.
; Without motion vectors Interleaved / Feedback / Hybrid do not run (one network pass) and the status line says why. Each method has its own settings:
; Passes = how strong (1.00 .. 8.00, default 3.00, in legacy passes); HaloLimit = limits new halos (default 0);
; Fine = the amount of the fine detail in the strengthening (0 .. 2; lower it when the game's own grain gets amplified). In fast mode the legacy passes and the settings of pass 2 on below are ignored.
NRFastExtrapolationPasses = 3.00
NRFastExtrapolationHaloLimit = 0
NRFastExtrapolationFine = 0.00
; Extrapolation's Fine: default 0.00
NRFastFeedbackPasses = 3.00
NRFastFeedbackHaloLimit = 0
NRFastFeedbackFine = 1.00
NRFastHybridPasses = 3.00
NRFastHybridHaloLimit = 0
NRFastHybridFine = 1.00
; Feedback's and Hybrid's Fine: default 1.00
NRFastEditStrength = 2.00
; the Edit strength method's strength: 0 .. 4, default 2.00; 1 = the network as it is.
NRFastInterleavedPasses = 3
; Interleaved: 2 .. 8 (default 3) legacy passes, one of them each frame. Every pass more holds two more pictures at the network's size in video memory.
NRFastInterleavedPreset = 1
; Interleaved's processing method: 1 or 2 (default 1).

NRPasses = 1
; 1 .. 4, default 1; 1 .. 30 with NRUnlockPasses = 1
NRUnlockPasses = 0
; 1 = NRPasses may go above 4, up to 30 (as OptiScaler's UnlockPasses; RenoDX itself stops at 4); passes 5 and later take pass 4's settings.
; Every pass runs the network once more, which lowers the frame rate a lot. 0 = off (default)

NRChainedHistory = 1
; 1 = from pass 2 on every pass keeps its own history, restarted only on scene cuts and the like (default); 0 = from pass 2 on, every frame starts afresh
; (RenoDX's diagnostic mode, may flicker, for comparison only)

NRNoiseEveryFrame = 1
; ours. 1 = the network's noise seed changes every frame, as NVIDIA's original does (default); 0 = the same seed every frame

; settings of passes 2, 3 and 4 (passes after 4 use pass 4's):
; Transfer / Color: how strongly this pass is put back, as NRTransferStrength / NRColorStrength, 0 .. 1, default 1;
; Intensity: this pass's strength of the enhancement, 0 .. 2, default 1;
; FollowPass1: 1 = this pass's network settings are pass 1's (default); 0 = this pass's own Style / LocalTone / Structure /
; Skin / AutoMask (meaning as for pass 1 above)

NRPass2Transfer = 1.00
NRPass2Color = 1.00
NRPass2Intensity = 1.00
NRPass2FollowPass1 = 1
NRPass2Style = 0
NRPass2LocalTone = 1.00
NRPass2Structure = 1.00
NRPass2Skin = -1.00
NRPass2AutoMask = 0

NRPass3Transfer = 1.00
NRPass3Color = 1.00
NRPass3Intensity = 1.00
NRPass3FollowPass1 = 1
NRPass3Style = 0
NRPass3LocalTone = 1.00
NRPass3Structure = 1.00
NRPass3Skin = -1.00
NRPass3AutoMask = 0

NRPass4Transfer = 1.00
NRPass4Color = 1.00
NRPass4Intensity = 1.00
NRPass4FollowPass1 = 1
NRPass4Style = 0
NRPass4LocalTone = 1.00
NRPass4Structure = 1.00
NRPass4Skin = -1.00
NRPass4AutoMask = 0

; how NR's result is put back into the picture

NRColorStrength = 1.00
; 0 .. 1, default 1. Float HDR pictures: how much of NR's change is used (0 = the original picture); SDR and HDR10 pictures: how much of NR's colour is used
; (0 = only NR's change of brightness)

NRTransferStrength = 1.00
; 0 .. 1, default 1. Strength of NR's change on HDR10 pictures, and of the HDR shadow restore

NRChromaClamp = 1.00
; 0.25 .. 2 stops, default 1. How far NR may change a colour on HDR pictures

NRTransferMode = 0
; HDR pictures: 0 = by the ratio before / after NR only (default); 1 = also compensated by the slope of the display curve, less of the change is lost in bright areas

NRStyleHighlightGuard = 0.00
; 0 .. 2 stops, default 0 (off). How far NR may darken highlights on HDR pictures

NRDetailStability = 1
; smooths NR's change over time along the motion vectors, less flickering detail: 0 = auto (on after the upscaler with motion vectors); 1 = off (default); 2 = always on

NRResolutionScale = 1.00
; the NR network's resolution, 0.33 .. 1 of the picture, default 1. Below 1 the network is faster; the change is enlarged back to the picture by NRLookUpsample below

NRFollowInputRes = 0
; 1 = the NR network runs at the game's render resolution (the motion vectors' resolution) instead of NRResolutionScale; 0 = off (default)

NRLookUpsample = 0
; with the network below the picture's resolution, how the change is enlarged back: 0 = auto (edge-aware, default); 1 = edge-aware; 2 = classic (plain enlargement);
; 3 = edge-aware, with SDR pictures reduced by area for the network (a change restarts the network's history)

NRLookMode = 0
; RenoDX's Adjust NR's look: adjusts how much NR changed, directly on its result; changes apply at once, the network does not restart.
; 1 = on, the NRLook* keys below apply; 0 = off, NR's result is used as it is (default). Every NRLook* default leaves the result as it is

NRLookStrength = 1.00
; 0 .. 2, default 1. NR's whole change (in stops): 0 = removed, 1 = kept, 2 = doubled

NRLookBrighten = 1.00
; 0 .. 2, default 1. How much of NR's brightening is kept: 0 = none, 2 = doubled

NRLookDarken = 1.00
; 0 .. 2, default 1. How much of NR's darkening is kept (including the dark halos it leaves around bright objects)

NRLookColour = 1.00
; 0 .. 2, default 1. How far NR moves colours towards or away from grey: 0 = keep the game's saturation, 2 = doubled

NRLookHue = 1.00
; 0 .. 2, default 1. How far NR turns hues (colour casts): 0 = keep the game's hues

NRLookShadows = 1.00
; 0 .. 2, default 1. Multiplier of the change in the game picture's dark areas

NRLookMidtones = 1.00
; 0 .. 2, default 1. Multiplier of the change in midtones

NRLookHighlights = 1.00
; 0 .. 2, default 1. Multiplier of the change in bright areas

NRLookMaxBrighten = 0.00
; 0 .. 4 stops, default 0 (no limit). How far NR may brighten a pixel (soft limit)

NRLookMaxDarken = 0.00
; 0 .. 4 stops, default 0 (no limit). How far NR may darken a pixel (soft limit)

NRLookMaxColour = 0.00
; 0 .. 2 stops, default 0 (no limit). How far NR may change a colour (soft limit)

NRLookTone = 1.00
; 0 .. 2, default 1. Multiplier of NR's broad lighting changes (fine ones: NRLookDetail)

NRLookDetail = 1.00
; 0 .. 2, default 1. Multiplier of NR's fine detail changes

NRLookDetailRadius = 1.00
; 0.25 .. 4, default 1. Where broad turns into fine, in percent of the network picture's height

NRLookHalo = 0.00
; 0 .. 1, default 0. Weakens the dark halos NR leaves beside bright objects; even darkening of whole areas and shadows beside dark objects stay.
; The larger NRLookDetailRadius, the wider the halos it handles

NRLookHaloBrightSide = 0.00
; 0 .. 1, default 0. Weakens the soft dark edge NR leaves on the brighter side of dark objects (deeper with every pass)

NRLookStabilize = 0
; smooths NR's broad changes over time: 0 = off (default); 1 = static (for still pictures); 2 = along the motion vectors.
; When on, it replaces NRDetailStability; lighting changes lag slightly

NRLookStabilizeMs = 60
; 10 .. 250 ms, default 60. How long the smoothing remembers: longer is steadier and follows lighting changes more slowly

NRLookStabilizeDetail = 0
; 1 = fine detail is smoothed too; 0 = broad changes only (default)

NRSdrBlackRestore = 0
; SDR pictures, taking back NR's lift in dark areas: 0 = near-black areas only (default); 1 = all areas; 2 = as 0, with a smooth transition at the threshold

NRDisplayPedestal = 0
; HDR pictures, shadow restore: 0 = auto (none on float HDR, default); 1 = always; 2 = as 0, with a smooth transition at the threshold

NRCodecMode = 2
; HDR encoding: 0 = classic; 1 = anchored; 2 = auto (default); 3 = display

NRNeuralFloorGuard = 1
; 1 = protects colours where NR's result is near black (default); 0 = off

; the picture's encoding and brightness

NRSourceEncoding = 0
; what the picture's values mean: 0 = auto (default: by the format; on the OptiScaler route also the game's HDR / AutoExposure flags); 1 = SDR;
; 2 = linear light; 3 = PQ
; it reads the units within the encoder the format and the HDR flag chose; it does not switch encoders

NRLinearUnitNits = 0.0
; 0 .. 10000, default 0. Above 0, float pictures are taken in absolute units: 1.0 = this many nits

NRProxyAnchor = 4.00
; 0.5 .. 32 nits, default 4. Encoding anchor of absolute-unit HDR

NRPaperWhiteScale = 2.5375
; 0.005 .. 16, default 2.5375 (203/80)

NRDiffuseWhiteNits = 203.0
; 80 .. 1000, default 203. Diffuse white of PQ pictures

NRPQCalibration = 1.000
; 0.005 .. 16, default 1

NRFeedMode = 0
; what float HDR pictures are divided by before NR: 0 = auto (the game's exposure when it hands over a readable exposure texture without AutoExposure,
; range-checked, otherwise computed from the picture, default); 1 = always computed from the picture; 2 = always the game's exposure (1 without a texture)
; The ReShade routes have no game exposure and always compute it from the picture

NRPresentEncoding = 0
; RenoDX layers at Present (ReShade and OptiScaler routes): the picture's encoding.
; 0 = from the swap chain's colour space (default); 1 = SDR; 2 = HDR10; 3 = scRGB

NRPresentWhiteNits = 0.0
; HDR pictures with NR at Present: diffuse white in nits. 0 = auto (default; on both routes a RenoDX mod's Game
; Brightness, Windows' SDR content brightness, NRDiffuseWhiteNits, in this order)

NRPresentWhiteSource = 0
; 0 = auto (default); 1 = do not take a RenoDX mod's Game Brightness

NRNormGovernor = 2
; how the automatic divisor of relative-unit HDR follows the picture: 0 = taken every frame as it is; 1 = rate-limited every frame; 2 = steady (default)

NRNormCutAware = 1
; 1 = the automatic divisor restarts at once on the game's scene cuts (Reset) (default); 0 = off

NRNormAttackStops = 4.00
; 0.1 .. 64, default 4. In steady mode, how many stops a second the divisor may grow (the picture NR sees gets darker)

NRNormReleaseStops = 0.50
; 0.05 .. 16, default 0.5. In steady mode, how many stops a second the divisor may shrink

NRNormSlewStops = 0.020
; 0 .. 0.5, default 0.02. In rate-limited mode, how many stops a frame at most

; depth and motion vectors

NRPresentGuides = 0
; RenoDX layers at Present (ReShade and OptiScaler routes): 0 = motion vectors when there are some (DLSS5_Feed on the ReShade
; route, on the OptiScaler route what the game handed the upscaler this frame), neutral ones (no motion, no depth) otherwise, NR runs either way
; (default); 1 = no NR without motion vectors; 2 = always neutral ones (games whose motion vectors are not used)

NRDepthMode = 0
; depth direction: 0 = by the game's flag (default); 1 = taken as normal depth; 2 = taken as reversed depth

NRMVecScaleX = 1.000
; -2 .. 2, default 1. Multiplier of the game's motion vectors in X (for games that hand over wrong ones)

NRMVecScaleY = 1.000
; -2 .. 2, default 1. Multiplier of the game's motion vectors in Y

; screenshots: the same frame without and with NR (RenoDX's NR screenshot), saved to the NR Screenshots folder in the game folder

NRScreenshotKey = F5
; screenshot hotkey, default F5; empty = none (NR Control has a screenshot button too)

NRScreenshotSource = 0
; what is captured: 0 = auto (default, as 1); 1 = the final picture (on the ReShade route the picture sent to the display; on the OptiScaler
; route NR moves to the finished picture for one frame in DirectX 12 games; DirectX 11 and Vulkan games capture the picture where NR runs);
; 2 = the model's input and output (for diagnosis)

NRScreenshotFormat = 0
; 0 = PNG (default, lossless; HDR as 16-bit PQ, kept HDR); 1 = JPEG; 2 = both

NRScreenshotLayout = 0
; 0 = two pictures (default); 1 = also a side-by-side picture (left NR off, right NR on)

NRScreenshotJpegQuality = 95
; 80 .. 100, default 95. JPEG quality

NRScreenshotMaxMB = 10
; 0 .. 500, default 10. Above this many MB a JPEG's quality is lowered (to 85 at the least, the picture is not scaled down); 0 = no limit

NROutputRect = 1
; OptiScaler route: 0 Auto (the size at creation first), 1 Declared (default, as 0.0.7: the evaluate's size first), 2 Resource (the resource's size)

NRPresentFrames = 0
; RenoDX Present layers on the OptiScaler route: 0 = NR runs at every Present, the motion vectors scaled by the presents a game frame (default);
; 1 = NR runs at the first Present after each game frame only.

NRPresentFgSource = 0
; RenoDX Present layers on the OptiScaler route: how the frame generation factor is found. 0 = DLSSG.MultiFrameCount first, else steady timing (default);
; 1 = steady timing; 2 = the old timing rule.

[Inspect]
; NR Control's comparison and debugging tools (the menu's Compare page); apply when saved. On the ReShade route: the Add-ons page.

Compare = 0
; 0 = off (default); 1 = side by side; 2 = split line (NR off on one side, on on the other)
Split = 0.50
; 0 .. 1, default 0.5. Where the split line is
Zoom = 1.00
; 1 .. 2, default 1. Side by side: 1 = each side the whole picture (black bars above and below); 2 = each half filled (sides cropped).
Swap = false
; true = the NR-on side on the left
Tags = false
TagScale = 1.50
; Tags = true: NR off / NR on written at the top of each side; TagScale 0.5 .. 4, default 1.5, the text size
Layer = 0
; 0 = compare the final picture (every layer at the last place that runs, all off against all on, default); N = only layer N's own input and output
ApplyModel = true
; false = the layer runs as usual (same cost) but its result is not put on the picture, to compare back and forth
; for the chosen layer only (Layer = N):
DebugView = 0
; 0 = off (default); 1 = the network's input; 2 = the network's output; 3 = the network's change x20 (grey = no change).
; RenoDX layers show it in the network's own encoding
SkinMask = false
; true = wilsjo2 layers: the skin weight (white = skin) in place of the picture
HoldFrame = false
; true = this layer's input is kept from one frame and used every frame after (for tuning; motion and neighbouring frames are not representative)
SpatialOutlines = false
; true = wilsjo2 layers with SpatialCompression: the work area (orange) and the centre band (cyan) drawn

[HudFix]
; HUD FIX: layers at Present leave the game's HUD (crosshair, health bars, subtitles, menus) as it is. Applies when saved.

Mode = off
; off = off (the default); auto = the best of the ones below that can be used;
; game = the HUD-less picture the game hands to frame generation (FSR 3.1, XeSS frame generation, DLSS-G through Streamline or NGX; D3D12 games):
;        NR runs on the HUD-less picture, the HUD is put back as it was, frame generation gets NR's picture; only when the game runs frame
;        generation and hands over a HUD-less picture. OptiScaler's own frame generation gets no such picture; captured serves those games;
; captured = the picture taken before the game draws its HUD: NR runs on it, the HUD is put back as it was (games that draw the HUD over
;            the finished picture; not Vulkan or D3D9 games on the ReShade route); where a D3D12 game composes its HUD in its final pass,
;            the picture that pass reads, used where it matches the presented frame outside the HUD.
; A method that cannot be used is greyed out in the menu with the reason
ShowMask = false
; true = shows the HUD's area (white = HUD, kept as the game drew it), for debugging

[GPU]
; Which network the GPU runs is decided by its architecture. Takes effect when the game restarts.

Architecture = auto
; auto (default) = AMD's driver tells it (its compiler names the GPU the code is for; a renamed or spoofed GPU -
;                  OptiScaler's GPU spoofing - does not change that)
; rdna4 = an RX 9000 (RDNA4). rdna3 = an RX 7000 or Radeon 700M / 800M / 8000S graphics (RDNA3 / RDNA3.5)
; Set it by hand where NR says it cannot tell the GPU: it is then used as set, whatever the driver or the GPU's
; IDs say (a wrong one runs another GPU's machine code: the game may stop - set it back to auto)

[Log]
; dlssnr-amd.log in the game folder. Takes effect when the game restarts.

Enabled = 1
; 1 = write the log (default)
; 0 = no log

ClearOnStart = 1
; 1 = clear the previous log at every game start (default)
; 0 = keep appending to the previous log
